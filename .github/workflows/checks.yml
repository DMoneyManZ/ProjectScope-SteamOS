name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gtk-4.0 x11-utils libglib2.0-bin gjs gnome-settings-daemon-common desktop-file-utils
      - name: Python and profile checks
        run: |
          glib-compile-schemas --strict extension/schemas
          python3 -m unittest discover -s tests -v
          python3 tools/check_presets.py
          python3 -m compileall -q projectscope tools tests
      - name: GJS checks
        run: |
          gjs -m tests/test_draw.js
          gjs -m tests/test_cycle.js
          gjs -m tests/test_colors.js
          mkdir -p build
          gjs -m tests/test_random.js > build/random-samples.jsonl
      - name: Build and inspect installer
        run: |
          python3 tools/build_release.py
          python3 dist/ProjectScope-1.0.0-linux.run --help
          python3 dist/ProjectScope-1.0.0-linux.run --extract /tmp/projectscope-release
          cd dist
          sha256sum --check SHA256SUMS
      - name: SteamOS bundle and AppDir
        run: |
          python3 tools/build_steamos.py
          python3 tools/build_appimage.py
